<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joycean | Medical Student, UNIMAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F9;--surface:#FFFFFF;--ink:#14283C;--muted:#5A6B7B;--line:#D9E1E6;--accent:#0E7C86;--tint:#E3F0F1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B26;--surface:#162636;--ink:#E8EEF2;--muted:#9FB0BD;--line:#274055;--accent:#4FC3CC;--tint:#143B44}}
:root[data-theme="dark"]{--bg:#0F1B26;--surface:#162636;--ink:#E8EEF2;--muted:#9FB0BD;--line:#274055;--accent:#4FC3CC;--tint:#143B44}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Public Sans",system-ui,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
.brand{font:600 19px "Newsreader",Georgia,serif;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:20px;font-size:15px;font-weight:500}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--accent)}
.hero{padding:72px 0 56px}
.hero h1{font:600 clamp(40px,8vw,68px)/1.05 "Newsreader",Georgia,serif;margin:0 0 20px;letter-spacing:-.02em}
.hero p.lead{font-size:20px;color:var(--muted);max-width:34em;margin:0 0 28px}
.ecg{display:block;width:100%;height:64px;margin:8px 0 32px}
.ecg path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.facts span{background:var(--tint);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:14.5px;font-weight:500}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font:600 32px/1.2 "Newsreader",Georgia,serif;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 32px;max-width:36em}
.about p{max-width:38em;margin:0 0 16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
summary{cursor:pointer;padding:18px 22px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--muted);font-size:14px;white-space:nowrap}
summary::after{content:"+";color:var(--accent);font-size:22px;font-weight:400;margin-left:auto;padding-left:12px}
details[open] summary::after{content:"\2212"}
.body{padding:0 22px 20px;max-width:38em}
.body ul{padding-left:20px;margin:8px 0}
.log{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.log li{position:relative;padding:0 0 32px 12px}
.log li::before{content:"";position:absolute;left:-30px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.log time{display:block;font-size:14px;color:var(--muted);font-weight:500}
.log h3{font:600 21px/1.3 "Newsreader",Georgia,serif;margin:2px 0 6px}
.log p{margin:0;max-width:36em}
footer{padding:40px 0 56px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px}
figure{margin:16px 0 0}figure img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}figure video{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}.yt{position:relative;aspect-ratio:16/9}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}.todo{list-style:none;margin:0;padding:0}.todo li{display:flex;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.todo .box{flex:none;width:20px;height:20px;border:2px solid var(--accent);border-radius:5px;display:inline-grid;place-items:center;font-size:13px;line-height:1;transform:translateY(3px)}.todo .done .box{background:var(--accent);color:var(--bg)}.todo .done .t{color:var(--muted);text-decoration:line-through}.todo small{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 24px}.tab{flex:none;font:500 15px "Public Sans",system-ui,sans-serif;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}.bhead{display:flex;align-items:center;gap:12px;margin:0 0 16px}.bhead h3{font:600 22px/1.3 "Newsreader",Georgia,serif;margin:0}.badge{background:var(--tint);color:var(--ink);font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}.week{margin:0 0 28px}.week h4{font:600 16px/1.4 "Public Sans",system-ui,sans-serif;color:var(--accent);margin:0 0 10px}.empty{color:var(--muted);margin:0;font-size:15px}.files{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.file{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}.file:hover{border-color:var(--accent);color:var(--accent)}.file.important{border-color:var(--accent);background:var(--tint);font-weight:600}.must{margin-left:4px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.02em}.folder>summary{font-weight:600}.folder .fn{flex:1}.fbody{padding:0 14px 12px}.fbody details{background:var(--bg)}</style></head><body><header class="nav"><div class="wrap"><a class="brand" href="#top">Joycean</a>
<nav aria-label="Primary"><a href="#about">About</a><a href="#todo">To-do</a><a href="#notes">Notes</a><a href="#log">Log</a></nav></div></header><main id="root" class="wrap"></main><footer><div class="wrap">© 2026 Joycean. Medical student at Universiti Malaysia Sarawak. Notes are for learning and are not medical advice.</div></footer><script>
const root=document.getElementById('root');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rich=t=>{let o='',ul=false;String(t).split('\n').forEach(l=>{l=l.trim();if(!l){if(ul){o+='</ul>';ul=false}return}if(l.startsWith('- ')){if(!ul){o+='<ul>';ul=true}o+='<li>'+esc(l.slice(2))+'</li>'}else{if(ul){o+='</ul>';ul=false}o+='<p>'+esc(l)+'</p>'}});return o+(ul?'</ul>':'')};
const img=o=>o.image?'<figure><img src="'+esc(o.image)+'" alt="'+esc(o.alt||'')+'" loading="lazy"></figure>':'';
const yt=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:''};
const media=o=>img(o)+(o.video?'<figure><video controls preload="metadata" playsinline src="'+esc(o.video)+'"'+(o.poster?' poster="'+esc(o.poster)+'"':'')+'></video></figure>':'')+(yt(o.youtube||'')?'<figure class="yt"><iframe src="https://www.youtube-nocookie.com/embed/'+yt(o.youtube)+'" title="'+esc(o.alt||'Video')+'" loading="lazy" allowfullscreen></iframe></figure>':'');
const todo=D=>{if(!D.todos||!D.todos.length)return '';const L=[...D.todos].sort((a,b)=>(!!a.done)-(!!b.done));return '<section id="todo"><h2>To-do list</h2><p class="sub">What I’m working on and what’s already done.</p><ul class="todo">'+L.map(t=>'<li class="'+(t.done?'done':'')+'"><span class="box" aria-hidden="true">'+(t.done?'✓':'')+'</span><span class="t">'+esc(t.task)+'</span><span class="sr">'+(t.done?' (done)':' (not done)')+'</span>'+(t.due?'<small>'+esc(t.due)+'</small>':'')+'</li>').join('')+'</ul></section>'};
const links=o=>o.links&&o.links.length?'<p class="files">'+o.links.map(f=>'<a class="file" href="'+esc(f.url)+'" target="_blank" rel="noopener"><span aria-hidden="true">🔗</span> '+esc(f.label||f.url)+'</a>').join('')+'</p>':'';
const files=o=>o.files&&o.files.length?'<p class="files">'+[...o.files].sort((a,b)=>(!!b.important)-(!!a.important)).map(f=>'<a class="file'+(f.important?' important':'')+'" href="'+esc(f.url)+'" target="_blank" rel="noopener"><span aria-hidden="true">'+(f.important?'⭐':'📄')+'</span> '+esc(f.label||f.url)+(f.important?'<span class="must">Must read</span>':'')+'</a>').join('')+'</p>':'';
const noteHTML=(n,open)=>'<details'+(open?' open':'')+'><summary>'+esc(n.title)+'<small>'+esc(n.tag||'')+'</small></summary><div class="body">'+rich(n.body||'')+media(n)+links(n)+files(n)+'</div></details>';
const notesList=(a,open)=>a.map((n,i)=>noteHTML(n,open&&i===0)).join('');
const folderHTML=f=>{const k=(f.notes||[]).length+(f.files||[]).length+(f.links||[]).length;return '<details class="folder"><summary><span aria-hidden="true">📁</span> <span class="fn">'+esc(f.name)+'</span><small>'+(k?k+(k>1?' items':' item'):'Empty')+'</small></summary><div class="fbody">'+(f.description?'<p class="wsum">'+esc(f.description)+'</p>':'')+media(f)+links(f)+files(f)+notesList(f.notes||[],false)+'</div></details>'};
const foldersList=a=>(a||[]).map(folderHTML).join('');
const blockHTML=b=>{const hasN=b.notes&&b.notes.length,hasW=b.weeks&&b.weeks.length;let h='<div class="bhead"><h3>'+esc(b.name)+(b.title?' · '+esc(b.title):'')+'</h3>'+(b.current?'<span class="badge">Current</span>':'')+'</div>';
if(hasN)h+=notesList(b.notes,true);
if(b.folders&&b.folders.length)h+=foldersList(b.folders);
if(hasW)b.weeks.forEach(w=>{h+='<div class="week"><h4>'+esc(w.label||'Week')+(w.title?' · '+esc(w.title):'')+'</h4>'+media(w)+files(w)+foldersList(w.folders)+((w.notes&&w.notes.length)?notesList(w.notes,false):((w.files&&w.files.length)||(w.folders&&w.folders.length)||w.image||w.video||w.youtube?'':'<p class="empty">No notes yet.</p>'))+'</div>'});
if(!hasN&&!hasW&&!(b.folders&&b.folders.length))h+='<p class="empty">No notes yet.</p>';
return h};
const notesSection=D=>{const B=D.blocks||[{name:'Notes',notes:D.notes||[]}];const cur=Math.max(0,B.findIndex(b=>b.current));
return '<section id="notes"><h2>Study notes</h2><p class="sub">Organised by block and week. Tap a topic to open it.</p>'+(B.length>1?'<div class="tabs" role="tablist">'+B.map((b,i)=>'<button type="button" role="tab" class="tab" data-i="'+i+'" aria-selected="'+(i===cur)+'">'+esc(b.name)+'</button>').join('')+'</div>':'')+B.map((b,i)=>'<div class="panel" role="tabpanel" data-i="'+i+'"'+(i===cur?'':' hidden')+'>'+blockHTML(b)+'</div>').join('')+'</section>'};
const bindTabs=()=>{const tabs=root.querySelectorAll('.tab'),ps=root.querySelectorAll('.panel');tabs.forEach(t=>{t.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-selected',x===t?'true':'false'));ps.forEach(p=>{p.hidden=p.dataset.i!==t.dataset.i})}})};
const ECG='M0 36 H150 L170 36 L184 8 L200 58 L214 28 L228 36 H400 L420 36 L434 8 L450 58 L464 28 L478 36 H650 L670 36 L684 8 L700 58 L714 28 L728 36 H800';
function render(D){
const h=D.hero;
root.innerHTML='<div class="hero" id="top"><h1>'+esc(h.title)+'</h1><p class="lead">'+esc(h.lead)+'</p><svg class="ecg" viewBox="0 0 800 64" preserveAspectRatio="none" aria-hidden="true"><path d="'+ECG+'"/></svg><div class="facts">'+h.facts.split(',').filter(f=>f.trim()).map(f=>'<span>'+esc(f.trim())+'</span>').join('')+'</div></div>'
+'<section id="about" class="about"><h2>About me</h2><p class="sub">Who I am and what I’m working towards.</p>'+D.about.split(/\n\s*\n/).filter(p=>p.trim()).map(p=>'<p>'+esc(p.trim())+'</p>').join('')+'</section>'
+todo(D)+notesSection(D)
+'<section id="log"><h2>Daily log</h2><p class="sub">What I did, what I learned, and what’s next. Newest first.</p><ol class="log">'+D.log.map(l=>'<li><time>'+esc(l.date)+'</time><h3>'+esc(l.title)+'</h3><p>'+esc(l.text)+'</p>'+media(l)+links(l)+files(l)+'</li>').join('')+'</ol></section>';
bindTabs();
}
fetch('content.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(e=>{root.innerHTML='<section><h2>Content could not be loaded</h2><p class="sub">Check that content.json is in the same folder as index.html and that its punctuation is valid.</p></section>'});
</script></body></html>
